<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ITI_React_Tasks</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        color: #222;
        padding: 40px 20px;
      }

      header {
        text-align: center;
        margin-bottom: 40px;
      }

      h1 {
        margin-bottom: 10px;
      }

      .tasks-container {
        max-width: 1100px;
        margin: 0 auto;

        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
      }

      .task-card {
        height: 80px;

        background-color: white;
        border: 1px solid #ddd;
        border-radius: 10px;

        display: flex;
        justify-content: center;
        align-items: center;

        text-decoration: none;
        color: #222;

        font-size: 20px;
        font-weight: bold;

        transition: 0.2s;
      }

      .task-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      }

      @media (max-width: 600px) {
        body {
          padding: 25px 15px;
        }

        .tasks-container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>My Tasks</h1>
      <p>ITI React Tasks</p>
    </header>

    <main class="tasks-container">
      <a href="Day1/index.html" class="task-card"> Day 1 </a>
      <a href="Day2/index.html" class="task-card"> Day 2 </a>
      <a href="Day3/index.html" class="task-card"> Day 3 </a>
      <a href="#" class="task-card"> Day 4 </a>
      <a href="#" class="task-card"> Day 5 </a>
      <a href="Day6/index.html" class="task-card"> Day 6 </a>
      <a href="Day7/index.html" class="task-card"> Day 7 </a>
      <a href="Day8/index.html" class="task-card"> Day 8 </a>
      <a href="#" class="task-card"> Day 9 </a>
      <a href="Day10/index.html" class="task-card"> Day 10 </a>
      <a href="Day13/index.html" class="task-card"> Day 13 </a>
      <a href="Day15/index.html" class="task-card"> Day 15 </a>
      <a
        href="https://github.com/Mohamedmostafa110/ITI_React_Tasks/tree/master/Day16"
        class="task-card"
      >
        Day 16
      </a>
    </main>
  </body>
</html>
